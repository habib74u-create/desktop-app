name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch package.json for Windows CI
        # appdmg (and its own dependency fs-xattr) are Mac-only DMG-building
        # tools pulled in transitively by electron-builder. On Windows they
        # either hard-fail npm's platform check or need Visual Studio to
        # native-compile — and we never actually build a Mac .dmg here, so
        # we swap them for a harmless zero-dependency stub package just for
        # this CI run. This only edits the checked-out copy on the runner,
        # never your actual repo/Mac build.
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.overrides=Object.assign({},p.overrides,{appdmg:'npm:lodash.noop@^3.0.1','fs-xattr':'npm:lodash.noop@^3.0.1'});fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Install dependencies
        # Keep the checked-in package-lock.json this time (deleting it
        # earlier caused npm to freshly re-resolve dependency versions,
        # which surfaced an unrelated webpack "browser field" resolution
        # error from a newer transitive version). The override above
        # already handles the only packages that actually need skipping.
        run: npm install

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-installer
          path: release/*.exe
